version: '3.8'

services:
  app:
    build: .
    ports:
      - "3000:3000"
    volumes:
      - ./backend_sqlite/data:/app/backend_sqlite/data
    environment:
      - NODE_ENV=production
    networks:
      - frontend  # Same network as Nginx Proxy Manager
    restart: always
    env_file:
      - .env

  # Cloudflare Tunnel Service
  cloudflared:
    image: cloudflare/cloudflared:latest
    restart: always
    command: tunnel --no-autoupdate run --token ${CLOUDFLARE_TUNNEL_TOKEN}
    networks:
      - frontend  # Keeps it on the same network if needed

networks:
  frontend:
    external: true  # Ensure this matches an existing external network
